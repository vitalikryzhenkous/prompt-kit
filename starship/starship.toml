"$schema" = 'https://starship.rs/config-schema.json'
palette = "custom"
add_newline = false
format = """
$directory$git_branch$git_status$fill$nodejs${custom.agent}${custom.agent_warn}${custom.agent_root}$time$username
$character"""

[palettes.custom]
dir = "#89B4FA"
branch = "#CBA6F7"
node = "#A6E3A1"
agent = "#94E2D5"
warn = "#F9E2AF"
root = "#F38BA8"
time = "#9399B2"
user = "#6C7086"

[fill]
symbol = "─"
style = "fg:user"

[directory]
format = "[ $path]($style) "
style = "bold fg:dir"
truncation_length = 3

[git_branch]
format = "[ $branch]($style) "
style = "fg:branch"

[git_status]
format = "([$all_status$ahead_behind]($style)) "
style = "fg:branch"

[nodejs]
format = "[ $version]($style) "
style = "fg:node"

[time]
disabled = false
format = "[ $time]($style) "
time_format = "%H:%M"
style = "fg:time"

[username]
show_always = true
format = "[ $user]($style)"
style_user = "fg:user"
style_root = "fg:root"

[character]
success_symbol = "[❯](bold fg:node)"
error_symbol = "[❯](bold fg:root)"

# Agent gauge: prompt-kit-agent-read prints text only when its level matches.
# Keys via env: AGENT_SHOW=pct|tokens|bar  AGENT_WARN_AT  AGENT_ROOT_AT  AGENT_TTL
[custom.agent]
command = "AGENT_SHOW=pct AGENT_WARN_AT=70 AGENT_ROOT_AT=90 AGENT_TTL=120 prompt-kit-agent-read normal"
when = true
format = "[$output]($style) "
style = "fg:agent"
shell = ["sh"]

[custom.agent_warn]
command = "AGENT_SHOW=pct AGENT_WARN_AT=70 AGENT_ROOT_AT=90 AGENT_TTL=120 prompt-kit-agent-read warn"
when = true
format = "[$output]($style) "
style = "bold fg:warn"
shell = ["sh"]

[custom.agent_root]
command = "AGENT_SHOW=pct AGENT_WARN_AT=70 AGENT_ROOT_AT=90 AGENT_TTL=120 prompt-kit-agent-read root"
when = true
format = "[$output]($style) "
style = "bold fg:root"
shell = ["sh"]
