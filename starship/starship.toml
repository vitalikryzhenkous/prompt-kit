"$schema" = 'https://starship.rs/config-schema.json'
palette = "custom"
add_newline = false
format = """
$directory$git_branch$git_status${custom.pill_end}$fill$nodejs${custom.agent}${custom.agent_warn}${custom.agent_root}$time$username
$character"""

[palettes.custom]
dir = "#89B4FA"
branch = "#CBA6F7"
node = "#A6E3A1"
agent = "#94E2D5"
warn = "#F9E2AF"
root = "#F38BA8"
time = "#9399B2"
pill = "#313244"       # pill background: tune for your terminal theme
user_bg = "#45475A"    # username pill background
user = "#6C7086"

[fill]
symbol = "─"
style = "fg:user"

[directory]
format = "[](fg:pill)[  $path ]($style)"
style = "bold fg:dir bg:pill"
truncation_length = 3

[git_branch]
format = "[  $branch ]($style)"
style = "fg:branch bg:pill"

[git_status]
format = "([$all_status$ahead_behind ]($style))[](fg:pill) "
style = "fg:branch bg:pill"

[nodejs]
format = "[](fg:pill)[  $version ]($style)[](fg:pill) "
style = "fg:node bg:pill"

[time]
disabled = false
format = "[](fg:pill)[  $time ]($style)[](fg:pill) "
time_format = "%H:%M"
style = "fg:time bg:pill"

[username]
show_always = true
format = "[](fg:user_bg)[ 󱚣 $user ]($style)[](fg:user_bg)"
style_user = "fg:time bg:user_bg"
style_root = "fg:root bg:user_bg"

# Closes the folder/branch pill outside git repos (inside a repo git_status closes it).
[custom.pill_end]
command = "echo x"
when = "! git rev-parse --is-inside-work-tree >/dev/null 2>&1"
format = "[](fg:pill) "
shell = ["sh"]

[character]
success_symbol = "[❯](bold fg:node)"
error_symbol = "[❯](bold fg:root)"

# Agent gauge: prompt-kit-agent-read prints text only when its level matches.
# Parameters (show, ttl, scope, warn_at, root_at, compact_at): ~/.config/prompt-kit/agent.env, see docs/wiki/Agents.md
[custom.agent]
command = "prompt-kit-agent-read normal"
when = true
format = "([](fg:pill)[ $output ]($style)[](fg:pill) )"
style = "fg:agent bg:pill"
shell = ["sh"]

[custom.agent_warn]
command = "prompt-kit-agent-read warn"
when = true
format = "([](fg:pill)[ $output ]($style)[](fg:pill) )"
style = "bold fg:warn bg:pill"
shell = ["sh"]

[custom.agent_root]
command = "prompt-kit-agent-read root"
when = true
format = "([](fg:pill)[ $output ]($style)[](fg:pill) )"
style = "bold fg:root bg:pill"
shell = ["sh"]
